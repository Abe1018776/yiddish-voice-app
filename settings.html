<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Yiddish Voice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      width: 400px;
      min-height: 360px;
      overflow-y: auto;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    .container {
      padding: 24px 28px 20px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #ccc;
      margin-bottom: 5px;
    }

    .field input[type="text"],
    .field input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 6px;
      color: #eee;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input[type="text"]:focus,
    .field input[type="password"]:focus {
      border-color: #4a9eff;
    }

    .field input::placeholder {
      color: #555;
    }

    .field select {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 6px;
      color: #eee;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .field select:focus {
      border-color: #4a9eff;
    }

    .api-key-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .api-key-row input {
      flex: 1;
      min-width: 0;
    }

    .btn-toggle {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      font-family: system-ui, sans-serif;
      background: #2a2a4a;
      color: #ccc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .btn-toggle:hover {
      background: #353560;
    }

    .link-row {
      margin-top: 6px;
    }

    .link-row a {
      font-size: 12px;
      color: #4a9eff;
      text-decoration: none;
      cursor: pointer;
    }

    .link-row a:hover {
      text-decoration: underline;
    }

    .balance-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-check {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: system-ui, sans-serif;
      background: #2a2a4a;
      color: #ccc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-check:hover {
      background: #353560;
    }

    .balance-badge {
      font-size: 12px;
      color: #4ade80;
      font-weight: 600;
    }

    .field-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field-checkbox input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .field-checkbox input[type="checkbox"]:checked {
      background: #4a9eff;
      border-color: #4a9eff;
    }

    .field-checkbox input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .field-checkbox label {
      font-size: 13px;
      font-weight: 500;
      color: #ccc;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #2a2a4a;
    }

    .btn {
      padding: 8px 22px;
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:active {
      opacity: 0.85;
    }

    .btn-cancel {
      background: #2a2a4a;
      color: #ccc;
    }

    .btn-cancel:hover {
      background: #353560;
    }

    .btn-save {
      background: #4a9eff;
      color: #fff;
    }

    .btn-save:hover {
      background: #3b8be8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <div class="field">
      <label for="apiKey">API Key</label>
      <div class="api-key-row">
        <input type="password" id="apiKey" placeholder="ak_live_...">
        <button class="btn-toggle" id="btnToggleKey">Show</button>
      </div>
      <div class="link-row">
        <a href="#" id="linkDashboard">Get your API key</a>
      </div>
      <div class="balance-row">
        <button class="btn-check" id="btnCheckBalance">Check balance</button>
        <span class="balance-badge" id="balanceBadge"></span>
      </div>
    </div>

    <div class="field">
      <label for="model">Model</label>
      <select id="model">
        <option value="gemini">Gemini (Fine-tuned)</option>
        <option value="whisper">Whisper</option>
        <option value="yiddishlabs">YiddishLabs</option>
      </select>
    </div>

    <div class="field">
      <label for="apiBase">API Base URL</label>
      <input type="text" id="apiBase" placeholder="https://api.kohnai.ai">
    </div>

    <div class="field">
      <label for="globalHotkey">Global Hotkey</label>
      <input type="text" id="globalHotkey" placeholder="Ctrl+Shift+Space">
    </div>

    <div class="field-checkbox">
      <input type="checkbox" id="autoPlaceText">
      <label for="autoPlaceText">Auto-place text at cursor</label>
    </div>

    <div class="buttons">
      <button class="btn btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn btn-save" id="btnSave">Save</button>
    </div>
  </div>

  <script>
    const api = window.electronAPI;

    async function loadConfig() {
      try {
        const config = await api.invoke('get-config');
        if (!config) return;
        document.getElementById('apiKey').value = config.API_KEY || '';
        document.getElementById('model').value = config.MODEL || 'gemini';
        document.getElementById('apiBase').value = config.API_BASE || 'https://api.kohnai.ai';
        document.getElementById('globalHotkey').value = config.hotkey || 'Ctrl+Shift+Space';
        document.getElementById('autoPlaceText').checked = config.autoPlace !== false;
      } catch (err) {
        console.error('Failed to load config:', err);
      }
    }

    // Show/Hide API key
    document.getElementById('btnToggleKey').addEventListener('click', () => {
      const input = document.getElementById('apiKey');
      const btn = document.getElementById('btnToggleKey');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    });

    // Open dashboard in browser
    document.getElementById('linkDashboard').addEventListener('click', async (e) => {
      e.preventDefault();
      const config = await api.invoke('get-config');
      api.send('open-url', config.DASHBOARD_URL || 'https://asr.kohnai.ai/dashboard.html');
    });

    // Check balance
    document.getElementById('btnCheckBalance').addEventListener('click', async () => {
      const badge = document.getElementById('balanceBadge');
      badge.textContent = '...';
      try {
        const result = await api.invoke('check-balance');
        if (result.error) {
          badge.textContent = result.error;
          badge.style.color = '#ff6b6b';
        } else {
          badge.textContent = result.credits + ' credits';
          badge.style.color = '#4ade80';
        }
      } catch (err) {
        badge.textContent = 'Error';
        badge.style.color = '#ff6b6b';
      }
    });

    document.getElementById('btnSave').addEventListener('click', async () => {
      try {
        const config = await api.invoke('get-config');
        config.API_KEY = document.getElementById('apiKey').value.trim();
        config.MODEL = document.getElementById('model').value;
        config.API_BASE = document.getElementById('apiBase').value.trim() || 'https://api.kohnai.ai';
        config.hotkey = document.getElementById('globalHotkey').value.trim() || 'Ctrl+Shift+Space';
        config.autoPlace = document.getElementById('autoPlaceText').checked;
        await api.invoke('save-config', config);
        window.close();
      } catch (err) {
        console.error('Failed to save config:', err);
      }
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
      window.close();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
    });

    loadConfig();
  </script>
</body>
</html>
