<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Yiddish Voice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      width: 400px;
      min-height: 360px;
      overflow-y: auto;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    .container {
      padding: 24px 28px 20px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #ccc;
      margin-bottom: 5px;
    }

    .field input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 6px;
      color: #eee;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input[type="text"]:focus {
      border-color: #4a9eff;
    }

    .field input[type="text"]::placeholder {
      color: #555;
    }

    .field select {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 6px;
      color: #eee;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .field select:focus {
      border-color: #4a9eff;
    }

    .file-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .file-row input[type="text"] {
      flex: 1;
      min-width: 0;
    }

    .btn-browse {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #2a2a4a;
      color: #ccc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-browse:hover {
      background: #353560;
    }

    .btn-browse:active {
      opacity: 0.85;
    }

    .field-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field-checkbox input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .field-checkbox input[type="checkbox"]:checked {
      background: #4a9eff;
      border-color: #4a9eff;
    }

    .field-checkbox input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .field-checkbox label {
      font-size: 13px;
      font-weight: 500;
      color: #ccc;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #2a2a4a;
    }

    .btn {
      padding: 8px 22px;
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:active {
      opacity: 0.85;
    }

    .btn-cancel {
      background: #2a2a4a;
      color: #ccc;
    }

    .btn-cancel:hover {
      background: #353560;
    }

    .btn-save {
      background: #4a9eff;
      color: #fff;
    }

    .btn-save:hover {
      background: #3b8be8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <div class="field">
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="runpod-pod">RunPod 24/7 (Default)</option>
        <option value="vertex">Fine-tuned Yiddish Model (Vertex AI)</option>
      </select>
    </div>

    <div class="field">
      <label for="vertexServiceAccountPath">Service Account JSON</label>
      <div class="file-row">
        <input type="text" id="vertexServiceAccountPath" placeholder="Path to service account JSON file">
        <button class="btn-browse" id="btnBrowse">Browse...</button>
      </div>
    </div>

    <div class="field">
      <label for="globalHotkey">Global Hotkey</label>
      <input type="text" id="globalHotkey" placeholder="Ctrl+Shift+Space">
    </div>

    <div class="field-checkbox">
      <input type="checkbox" id="autoPlaceText">
      <label for="autoPlaceText">Auto-place text at cursor</label>
    </div>

    <div class="buttons">
      <button class="btn btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn btn-save" id="btnSave">Save</button>
    </div>
  </div>

  <script>
    const api = window.electronAPI;

    async function loadConfig() {
      try {
        const config = await api.invoke('get-config');
        if (!config) return;
        document.getElementById('provider').value = config.provider || 'runpod-pod';
        document.getElementById('vertexServiceAccountPath').value = config.vertexServiceAccountPath || '';
        document.getElementById('globalHotkey').value = config.hotkey || 'Ctrl+Shift+Space';
        document.getElementById('autoPlaceText').checked = config.autoPlace !== false;
      } catch (err) {
        console.error('Failed to load config:', err);
      }
    }

    document.getElementById('btnBrowse').addEventListener('click', async () => {
      const filePath = await api.invoke('select-file');
      if (filePath) document.getElementById('vertexServiceAccountPath').value = filePath;
    });

    document.getElementById('btnSave').addEventListener('click', async () => {
      try {
        const config = await api.invoke('get-config');
        config.provider = document.getElementById('provider').value;
        config.hotkey = document.getElementById('globalHotkey').value.trim() || 'Ctrl+Shift+Space';
        config.autoPlace = document.getElementById('autoPlaceText').checked;
        config.vertexServiceAccountPath = document.getElementById('vertexServiceAccountPath').value.trim();
        await api.invoke('save-config', config);
        window.close();
      } catch (err) {
        console.error('Failed to save config:', err);
      }
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
      window.close();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
    });

    loadConfig();
  </script>
</body>
</html>
