<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcription History - Yiddish Voice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .entry-count {
      font-size: 12px;
      color: #666;
      margin-right: 4px;
    }

    .btn-clear {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border: 1px solid #3a2a2a;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.08);
      color: #ef4444;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: #ef4444;
    }

    .btn-clear:active {
      opacity: 0.85;
    }

    .btn-clear:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn-clear:disabled:hover {
      background: rgba(239, 68, 68, 0.08);
      border-color: #3a2a2a;
    }

    /* Search / Filter Bar */
    .filter-bar {
      padding: 10px 20px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 6px;
      color: #eee;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #4a9eff;
    }

    .search-input::placeholder {
      color: #555;
    }

    /* History List */
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
      gap: 10px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: #333;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* History Entry */
    .history-entry {
      padding: 12px 14px;
      margin-bottom: 6px;
      background: #16163a;
      border: 1px solid #2e2e52;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }

    .history-entry:hover {
      background: #1e1e48;
      border-color: #3e3e62;
    }

    .history-entry:active {
      background: #222258;
    }

    .history-entry.copied {
      border-color: #4ade80;
    }

    .entry-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .entry-time {
      font-size: 11px;
      color: #777;
      font-variant-numeric: tabular-nums;
    }

    .entry-provider {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4a9eff;
      background: rgba(74, 158, 255, 0.1);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .entry-latency {
      font-size: 10px;
      color: #666;
      margin-left: auto;
    }

    .entry-text {
      font-size: 14px;
      line-height: 1.5;
      color: #ddd;
      word-break: break-word;
      user-select: text;
      direction: rtl;
      text-align: right;
    }

    .entry-copied-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 10px;
      font-weight: 600;
      color: #4ade80;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .history-entry.copied .entry-copied-badge {
      opacity: 1;
    }

    /* Delete button per entry */
    .entry-delete {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }

    .history-entry:hover .entry-delete {
      opacity: 1;
    }

    .entry-delete:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    .entry-delete svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .history-entry.copied .entry-delete {
      opacity: 0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #2e2e52;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3e3e62;
    }

    /* Confirm dialog overlay */
    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .confirm-overlay.visible {
      display: flex;
    }

    .confirm-dialog {
      background: #1e1e3a;
      border: 1px solid #2e2e52;
      border-radius: 10px;
      padding: 24px;
      max-width: 340px;
      text-align: center;
    }

    .confirm-dialog p {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .confirm-dialog .confirm-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .confirm-dialog .btn {
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .confirm-dialog .btn:active {
      opacity: 0.85;
    }

    .confirm-dialog .btn-cancel {
      background: #2a2a4a;
      color: #ccc;
    }

    .confirm-dialog .btn-cancel:hover {
      background: #353560;
    }

    .confirm-dialog .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .confirm-dialog .btn-danger:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>Transcription History</h1>
    <div class="header-actions">
      <span class="entry-count" id="entryCount"></span>
      <button class="btn-clear" id="btnClear" title="Clear all history">Clear All</button>
    </div>
  </div>

  <!-- Search -->
  <div class="filter-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="Search transcriptions...">
  </div>

  <!-- History List -->
  <div class="history-list" id="historyList">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <p>No transcriptions yet</p>
    </div>
  </div>

  <!-- Confirm Clear Dialog -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-dialog">
      <p>Clear all transcription history?<br>This cannot be undone.</p>
      <div class="confirm-buttons">
        <button class="btn btn-cancel" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmClear">Clear All</button>
      </div>
    </div>
  </div>

  <script>
    const api = window.electronAPI;

    // DOM elements
    const historyList = document.getElementById('historyList');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const btnClear = document.getElementById('btnClear');
    const entryCountEl = document.getElementById('entryCount');
    const confirmOverlay = document.getElementById('confirmOverlay');
    const confirmCancel = document.getElementById('confirmCancel');
    const confirmClear = document.getElementById('confirmClear');

    let entries = [];
    let copiedTimeout = null;

    // Provider display names
    const PROVIDER_LABELS = {
      'gemini': 'Gemini FT',
      'gemini-direct': 'Gemini 3.1',
      'runpod-whisper': 'Whisper',
      'runpod-omniasr': 'OmniASR',
      'vertex': 'Vertex FT',
      'runpod-pod': 'Pod 24/7',
    };

    /**
     * Format a timestamp for display.
     */
    function formatTime(isoString) {
      const d = new Date(isoString);
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();

      const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      if (isToday) {
        return time;
      }

      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      if (d.toDateString() === yesterday.toDateString()) {
        return 'Yesterday ' + time;
      }

      const date = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      return date + ' ' + time;
    }

    /**
     * Create a single history entry DOM element.
     */
    function createEntryElement(entry) {
      const el = document.createElement('div');
      el.className = 'history-entry';
      el.dataset.id = entry.id;

      const providerLabel = PROVIDER_LABELS[entry.provider] || entry.provider;
      const latencyText = entry.latencyMs ? entry.latencyMs + 'ms' : '';

      el.innerHTML =
        '<div class="entry-meta">' +
          '<span class="entry-time">' + escapeHtml(formatTime(entry.timestamp)) + '</span>' +
          '<span class="entry-provider">' + escapeHtml(providerLabel) + '</span>' +
          (latencyText ? '<span class="entry-latency">' + escapeHtml(latencyText) + '</span>' : '') +
        '</div>' +
        '<div class="entry-text">' + escapeHtml(entry.text) + '</div>' +
        '<span class="entry-copied-badge">Copied!</span>' +
        '<button class="entry-delete" title="Delete entry">' +
          '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>' +
        '</button>';

      // Click on entry to copy
      el.addEventListener('click', (e) => {
        // Don't copy if clicking delete button
        if (e.target.closest('.entry-delete')) return;
        copyEntry(entry, el);
      });

      // Delete button
      el.querySelector('.entry-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteEntry(entry.id, el);
      });

      return el;
    }

    /**
     * Escape HTML entities to prevent XSS.
     */
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /**
     * Copy entry text to clipboard and show feedback.
     */
    async function copyEntry(entry, el) {
      try {
        await api.invoke('copy-to-clipboard', entry.text);
        el.classList.add('copied');
        if (copiedTimeout) clearTimeout(copiedTimeout);
        copiedTimeout = setTimeout(() => {
          el.classList.remove('copied');
        }, 1200);
      } catch (err) {
        console.error('Failed to copy:', err);
      }
    }

    /**
     * Delete a single entry.
     */
    async function deleteEntry(id, el) {
      try {
        await api.invoke('history-delete', id);
        el.style.transition = 'opacity 0.2s, transform 0.2s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(() => {
          el.remove();
          entries = entries.filter(e => e.id !== id);
          updateCount();
          if (entries.length === 0) {
            emptyState.style.display = 'flex';
          }
        }, 200);
      } catch (err) {
        console.error('Failed to delete entry:', err);
      }
    }

    /**
     * Render the history list from the entries array.
     */
    function renderHistory(filter) {
      // Remove all non-empty-state children
      const children = Array.from(historyList.children);
      children.forEach(child => {
        if (child !== emptyState) child.remove();
      });

      const filterLower = (filter || '').toLowerCase();
      const filtered = filterLower
        ? entries.filter(e => e.text.toLowerCase().includes(filterLower))
        : entries;

      if (filtered.length === 0) {
        emptyState.style.display = 'flex';
        if (filterLower && entries.length > 0) {
          emptyState.querySelector('p').textContent = 'No matching transcriptions';
        } else {
          emptyState.querySelector('p').textContent = 'No transcriptions yet';
        }
      } else {
        emptyState.style.display = 'none';
        // Show newest first
        for (let i = filtered.length - 1; i >= 0; i--) {
          historyList.appendChild(createEntryElement(filtered[i]));
        }
      }

      updateCount();
    }

    /**
     * Update the entry count display.
     */
    function updateCount() {
      const count = entries.length;
      entryCountEl.textContent = count === 0 ? '' : count + (count === 1 ? ' entry' : ' entries');
      btnClear.disabled = count === 0;
    }

    /**
     * Load history from main process.
     */
    async function loadHistory() {
      try {
        entries = await api.invoke('history-get');
        renderHistory(searchInput.value);
      } catch (err) {
        console.error('Failed to load history:', err);
      }
    }

    // Search filtering
    let searchDebounce = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        renderHistory(searchInput.value);
      }, 150);
    });

    // Clear all - show confirmation
    btnClear.addEventListener('click', () => {
      if (entries.length === 0) return;
      confirmOverlay.classList.add('visible');
    });

    confirmCancel.addEventListener('click', () => {
      confirmOverlay.classList.remove('visible');
    });

    confirmOverlay.addEventListener('click', (e) => {
      if (e.target === confirmOverlay) {
        confirmOverlay.classList.remove('visible');
      }
    });

    confirmClear.addEventListener('click', async () => {
      confirmOverlay.classList.remove('visible');
      try {
        await api.invoke('history-clear');
        entries = [];
        renderHistory('');
        searchInput.value = '';
      } catch (err) {
        console.error('Failed to clear history:', err);
      }
    });

    // Listen for new entries pushed from main process
    api.on('history-new-entry', (entry) => {
      entries.push(entry);
      renderHistory(searchInput.value);
      // Scroll to top (newest entry) if not searching
      if (!searchInput.value) {
        historyList.scrollTop = 0;
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirmOverlay.classList.contains('visible')) {
          confirmOverlay.classList.remove('visible');
        } else {
          window.close();
        }
      }
      // Ctrl+F focuses search
      if (e.key === 'f' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    // Initialize
    loadHistory();
  </script>
</body>
</html>
