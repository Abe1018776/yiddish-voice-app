<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Yiddish Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      width: 380px;
      height: 280px;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { padding: 32px; width: 100%; }
    .logo { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .tagline { font-size: 13px; color: #888; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
    input[type="email"] {
      width: 100%; padding: 10px 12px; font-size: 14px;
      background: #16163a; border: 1px solid #2e2e52; border-radius: 6px;
      color: #eee; outline: none; margin-bottom: 20px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus { border-color: #4a9eff; }
    input[type="email"]::placeholder { color: #555; }
    .btn-start {
      width: 100%; padding: 11px; font-size: 14px; font-weight: 600;
      background: #4a9eff; color: #fff; border: none; border-radius: 6px;
      cursor: pointer; font-family: inherit; transition: background 0.2s;
    }
    .btn-start:hover { background: #3b8be8; }
    .btn-start:active { opacity: 0.85; }
    .error { font-size: 12px; color: #ff6b6b; margin-top: -14px; margin-bottom: 14px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Yiddish Voice</div>
    <div class="tagline">Yiddish speech-to-text</div>
    <label for="emailInput">Your Email</label>
    <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
    <div class="error" id="errorMsg">Please enter a valid email address.</div>
    <button class="btn-start" id="btnStart">Get Started</button>
  </div>
  <script>
    const api = window.electronAPI;
    document.getElementById('btnStart').addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const err = document.getElementById('errorMsg');
      if (!email || !email.includes('@')) {
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      await api.invoke('complete-setup', { email });
      window.close();
    });
    document.getElementById('emailInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btnStart').click();
    });
  </script>
</body>
</html>
