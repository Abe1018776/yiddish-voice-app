<!DOCTYPE html>
<html lang="yi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yiddish Voice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #pill {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 70px;
      background: rgba(20, 20, 20, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      padding: 0 10px 0 14px;
      gap: 12px;
      cursor: grab;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.3s ease;
    }

    #pill.recording {
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.2),
        0 0 0 1px rgba(239, 68, 68, 0.3),
        0 0 20px rgba(239, 68, 68, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* Mic Button */
    #mic-btn {

      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
      outline: none;
    }

    #mic-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: scale(1.05);
    }

    #mic-btn:active {
      transform: scale(0.95);
    }

    #mic-btn.recording {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    #mic-btn.recording:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    #mic-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Pulse ring on recording */
    #mic-btn.recording::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.5);
      animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.6; }
      70% { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    /* Center area */
    #center {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      min-width: 0;
    }

    /* Status text */
    #status-text {
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    #status-text.active {
      color: rgba(255, 255, 255, 0.88);
    }

    #status-text.success {
      color: #4ade80;
    }

    /* Recording dot */
    #rec-dot {
      display: none;
      width: 8px;
      height: 8px;
      min-width: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: dot-pulse 1.2s ease-in-out infinite;
    }

    #rec-dot.visible {
      display: block;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Waveform bars */
    #waveform {
      display: none;
      align-items: center;
      gap: 2px;
      height: 28px;
      margin-left: auto;
    }

    #waveform.visible {
      display: flex;
    }

    .wave-bar {
      width: 3px;
      border-radius: 1.5px;
      background: rgba(239, 68, 68, 0.7);
      height: 4px;
      transition: height 0.1s ease;
    }

    /* Spinner */
    #spinner {
      display: none;
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    #spinner.visible {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Settings gear */
    #settings-btn {

      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
    }

    #settings-btn:hover {
      color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.06);
    }

    #settings-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    #settings-btn:hover svg {
      transform: rotate(30deg);
    }

    /* Credit badge */
    #credit-badge {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      white-space: nowrap;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    #credit-badge.low {
      color: #facc15;
    }

    /* Setup button */
    #setup-btn {
      display: none;
      align-items: center;
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 6px;
      color: #facc15;
      padding: 3px 8px;
      cursor: pointer;
      font-family: system-ui, sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }

    #setup-btn:hover {
      background: rgba(250, 204, 21, 0.25);
    }

    /* Check mark for pasted state */
    #check-icon {
      display: none;
      color: #4ade80;
    }

    #check-icon.visible {
      display: flex;
    }

    #check-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div id="pill">
    <!-- Mic Button -->
    <button id="mic-btn" title="Click to record">
      <svg id="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <svg id="stop-icon" style="display:none" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>
      <span id="check-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
        </svg>
      </span>
    </button>

    <!-- Center content -->
    <div id="center">
      <span id="rec-dot"></span>
      <span id="spinner"></span>
      <span id="status-text">Ready</span>
      <div id="waveform"></div>
    </div>

    <!-- Credit balance -->
    <span id="credit-badge" title="Credit balance"></span>

    <!-- Setup button (shown when no API key) -->
    <button id="setup-btn" title="Setup" style="display:none">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <span style="font-size:10px;margin-left:2px">Setup</span>
    </button>

    <!-- Settings -->
    <button id="settings-btn" title="Settings">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>

  </div>

  <script>
    const api = window.electronAPI;

    // --- DOM Elements ---
    const pill = document.getElementById('pill');
    const micBtn = document.getElementById('mic-btn');
    const micIcon = document.getElementById('mic-icon');
    const stopIcon = document.getElementById('stop-icon');
    const checkIcon = document.getElementById('check-icon');
    const statusText = document.getElementById('status-text');
    const recDot = document.getElementById('rec-dot');
    const spinner = document.getElementById('spinner');
    const waveform = document.getElementById('waveform');
    const creditBadge = document.getElementById('credit-badge');
    const setupBtn = document.getElementById('setup-btn');
    const settingsBtn = document.getElementById('settings-btn');

    // --- State ---
    let state = 'idle'; // idle | recording | transcribing | pasted
    let mediaRecorder = null;
    let audioChunks = [];
    let audioStream = null;
    let audioContext = null;
    let analyserNode = null;
    let sourceNode = null;
    let animationFrameId = null;

    // --- Waveform Setup ---
    const BAR_COUNT = 16;
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      waveform.appendChild(bar);
    }
    const waveBars = waveform.querySelectorAll('.wave-bar');

    // --- Base64 helper (no Buffer in renderer with contextIsolation) ---
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    // --- Mouse events for click-through transparency + manual drag ---
    const pillEl = document.getElementById('pill');
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    pillEl.addEventListener('mouseenter', () => {
      api.send('set-ignore-mouse', false);
    });
    pillEl.addEventListener('mouseleave', () => {
      if (!isDragging) {
        api.send('set-ignore-mouse', true);
      }
    });

    pillEl.addEventListener('mousedown', (e) => {
      // Only drag from the pill background, not from buttons/select
      if (e.target.closest('button, select')) return;
      isDragging = true;
      dragStartX = e.screenX;
      dragStartY = e.screenY;
      pillEl.style.cursor = 'grabbing';
      api.send('window-drag-start');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - dragStartX;
      const dy = e.screenY - dragStartY;
      dragStartX = e.screenX;
      dragStartY = e.screenY;
      // Get current window position and apply delta
      const x = window.screenX + dx;
      const y = window.screenY + dy;
      api.send('move-window', { x, y });
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        pillEl.style.cursor = 'grab';
      }
    });

    // --- Settings ---
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      api.send('open-settings');
    });

    // --- Setup button ---
    setupBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      api.send('open-setup');
    });

    // --- State Transitions ---
    function setState(newState) {
      state = newState;

      // Reset all
      pill.classList.remove('recording');
      micBtn.classList.remove('recording');
      micIcon.style.display = 'none';
      stopIcon.style.display = 'none';
      checkIcon.classList.remove('visible');
      recDot.classList.remove('visible');
      spinner.classList.remove('visible');
      waveform.classList.remove('visible');
      statusText.classList.remove('active', 'success');

      switch (newState) {
        case 'idle':
          micIcon.style.display = 'block';
          statusText.textContent = 'Ready';
          micBtn.title = 'Click to record';
          break;

        case 'recording':
          pill.classList.add('recording');
          micBtn.classList.add('recording');
          stopIcon.style.display = 'block';
          recDot.classList.add('visible');
          waveform.classList.add('visible');
          statusText.textContent = 'Recording\u2026';
          statusText.classList.add('active');
          micBtn.title = 'Click to stop';
          break;

        case 'transcribing':
          micIcon.style.display = 'block';
          spinner.classList.add('visible');
          statusText.textContent = 'Transcribing\u2026';
          statusText.classList.add('active');
          micBtn.title = 'Transcribing...';
          break;

        case 'pasted':
          checkIcon.classList.add('visible');
          statusText.textContent = 'Pasted!';
          statusText.classList.add('success');
          micBtn.title = 'Click to record';
          setTimeout(() => {
            if (state === 'pasted') setState('idle');
          }, 1500);
          break;
      }
    }

    // --- Waveform Animation ---
    function startWaveformAnimation(stream) {
      // Reuse or create AudioContext to avoid leaks
      if (!audioContext || audioContext.state === 'closed') {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      // Clean up previous source/analyser nodes
      if (sourceNode) { try { sourceNode.disconnect(); } catch(e) {} }
      if (analyserNode) { try { analyserNode.disconnect(); } catch(e) {} }
      sourceNode = audioContext.createMediaStreamSource(stream);
      analyserNode = audioContext.createAnalyser();
      analyserNode.fftSize = 64;
      sourceNode.connect(analyserNode);

      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function animate() {
        if (state !== 'recording') return;
        analyserNode.getByteFrequencyData(dataArray);

        for (let i = 0; i < BAR_COUNT; i++) {
          const dataIndex = Math.floor(i * bufferLength / BAR_COUNT);
          const value = dataArray[dataIndex] || 0;
          const height = Math.max(3, (value / 255) * 26);
          waveBars[i].style.height = height + 'px';
        }

        animationFrameId = requestAnimationFrame(animate);
      }

      animate();
    }

    function stopWaveformAnimation() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      if (sourceNode) { try { sourceNode.disconnect(); } catch(e) {} sourceNode = null; }
      if (analyserNode) { try { analyserNode.disconnect(); } catch(e) {} analyserNode = null; }
      waveBars.forEach(bar => { bar.style.height = '4px'; });
    }

    // --- Recording ---
    async function startRecording() {
      try {
        audioChunks = [];
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: true,
            noiseSuppression: true,
          }
        });

        mediaRecorder = new MediaRecorder(audioStream, {
          mimeType: 'audio/webm;codecs=opus',
        });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stopWaveformAnimation();

          // Stop all tracks
          if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
            audioStream = null;
          }

          if (audioChunks.length === 0) {
            setState('idle');
            return;
          }

          setState('transcribing');

          const blob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
          audioChunks = []; // release memory immediately
          const arrayBuffer = await blob.arrayBuffer();
          const base64Audio = arrayBufferToBase64(arrayBuffer);

          api.send('transcribe', {
            audioBase64: base64Audio,
            mimeType: 'audio/webm;codecs=opus',
          });
        };

        mediaRecorder.start(250); // collect data every 250ms
        // State already set to 'recording' by click handler to prevent double-click race
        startWaveformAnimation(audioStream);

      } catch (err) {
        console.error('Failed to start recording:', err);
        statusText.textContent = 'Mic error';
        statusText.classList.add('active');
        setTimeout(() => setState('idle'), 2000);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // --- Mic Button (guard against double-click race) ---
    micBtn.addEventListener('click', () => {
      if (state === 'idle' || state === 'pasted') {
        setState('recording'); // block further clicks immediately
        startRecording();
      } else if (state === 'recording') {
        stopRecording();
      }
      // Do nothing if transcribing
    });

    // --- IPC Handlers ---
    api.on('transcription-result', (data) => {
      if (data.error) {
        console.error('Transcription error:', data.error);
        const shortErr = data.error.length > 40
          ? data.error.substring(0, 40) + '\u2026'
          : data.error;
        statusText.textContent = shortErr;
        statusText.classList.add('active');
        setTimeout(() => setState('idle'), 4000);
        return;
      }

      // Update credit badge from response
      if (typeof data.remaining === 'number') {
        updateCreditBadge(data.remaining);
      }

      setState('pasted');
    });

    // Listen for hotkey-triggered toggle from main process
    api.on('toggle-recording', () => {
      if (state === 'idle' || state === 'pasted') {
        setState('recording');
        startRecording();
      } else if (state === 'recording') {
        stopRecording();
      }
    });

    // --- Credit badge ---
    function updateCreditBadge(credits) {
      creditBadge.classList.remove('low');
      if (typeof credits === 'number') {
        creditBadge.textContent = '\u2B21 ' + credits + ' cr';
        if (credits < 50) {
          creditBadge.classList.add('low');
          creditBadge.textContent = '\u26A0 Low credits';
        }
      }
    }

    // Load config and fetch balance on startup
    async function initApp() {
      try {
        const cfg = await api.invoke('get-config');
        if (!cfg || !cfg.API_KEY) {
          // No API key — show setup button
          setupBtn.style.display = 'flex';
          creditBadge.textContent = '';
          return;
        }
        setupBtn.style.display = 'none';
        // Fetch credit balance
        const result = await api.invoke('check-balance');
        if (!result.error && typeof result.credits === 'number') {
          updateCreditBadge(result.credits);
        }
      } catch (err) {
        console.error('Failed to init:', err);
      }
    }

    // Initialize
    initApp();
    setState('idle');
  </script>
</body>
</html>
